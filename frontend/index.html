<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#9B1515" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ArigaTours — Descubre el auténtico Japón</title>
    <meta
      name="description"
      content="Agencia de tours privados y free walking tours por Japón: Tokio, Kioto, Osaka, Nara, Kobe, Himeji y Kamakura. Guías en español, inglés y japonés."
    />
    <!-- Los dos iconos salen del mismo logo, pero no son el mismo archivo.
         El de pestana va en PNG porque no todos los navegadores admiten WebP
         como favicon, y conserva la transparencia. El de iOS lleva fondo
         blanco a proposito: alli la transparencia no se respeta y el gato
         acabaria recortado sobre negro. -->
    <link rel="icon" href="/recursos/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/recursos/icono-apple.png" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <!-- Tipografias del diseño: Newsreader para titulos (fina, con eje
         optico) y Jost para el texto. Se piden solo los pesos que se usan.
         No se carga ninguna fuente japonesa: pesan cientos de KB y los tres
         sistemas traen una decente de serie, asi que el japones cae a la
         del sistema. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300;0,6..72,400;1,6..72,200;1,6..72,300&family=Jost:wght@300;400;500&display=swap"
    />
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
